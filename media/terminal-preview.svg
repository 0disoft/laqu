<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Laqu live column ledger</title>
  <desc id="description">Actual renderer output at 100 columns: aligned task, progress, count, percentage and state columns, with three running tasks. The caller message waiting does not change task lifecycle counts. Progress stays on stderr and stdout remains available for JSON.</desc>
